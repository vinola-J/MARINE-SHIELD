version: '3.8'

services:
  # ------------------------------------------
  # Backend API Service (FastAPI + PyTorch + RAG)
  # ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marine_shield_backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_URL=http://localhost:8000
      - DATABASE_URL=sqlite:///./marine_shield.db
      - VECTOR_DB_PATH=./vectorstore
      - MODEL_PATH=./models/marine_shield_model.pth
      - LOW_CONFIDENCE_THRESHOLD=0.60
      - LLM_PROVIDER=offline
      - LLM_MODEL=gemini-2.5-flash
      - LLM_API_KEY=
    volumes:
      - ./marine_shield.db:/app/marine_shield.db
      - ./uploads:/app/uploads
      - ./generated_reports:/app/generated_reports
      - ./models:/app/models
      - ./vectorstore:/app/vectorstore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ------------------------------------------
  # Frontend Service (Streamlit Dashboard)
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marine_shield_frontend
    restart: unless-stopped
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./generated_reports:/app/generated_reports
      - ./data:/app/data

networks:
  default:
    name: marine_shield_network
