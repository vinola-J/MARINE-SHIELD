services:
  - type: web
    name: marine-shield-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: offline
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.60"
